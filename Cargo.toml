[package]
name = "aujitter"
version = "0.1.1"
edition = "2024"
description = "Low-impact network monitoring and evidence for intermittent home internet"
rust-version = "1.98"
default-run = "aujitter"
license = "MIT"
repository = "https://github.com/peppermintish/aujitter"

[features]
default = []
desktop = ["dep:gpui-kit", "dep:tray-icon", "dep:async-channel", "dep:zbus", "dep:raw-window-handle", "dep:windows-sys"]

[[bin]]
name = "aujitter-gui"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[dependencies]
anyhow = "1"
async-channel = { version = "2", optional = true }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
gpui-kit = { version = "=0.7.0", optional = true }
netdev = "0.46.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
roxmltree = "0.21"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "process", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = { version = "=0.26.0", default-features = false, features = ["ksni"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", optional = true }

[target.'cfg(windows)'.dependencies]
raw-window-handle = { version = "0.6", optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 16
strip = "debuginfo"
