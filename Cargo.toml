[package]
name = "aujitter"
version = "0.1.0"
edition = "2024"
description = "Low-impact network monitoring and evidence for intermittent home internet"
rust-version = "1.98"
default-run = "aujitter"
license = "MIT"
repository = "https://github.com/peppermintish/aujitter"

[features]
default = []
desktop = ["dep:gpui-kit"]

[[bin]]
name = "aujitter-gui"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
gpui-kit = { version = "=0.7.0", optional = true }
netdev = "0.46.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
roxmltree = "0.21"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "process", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 16
strip = "debuginfo"
